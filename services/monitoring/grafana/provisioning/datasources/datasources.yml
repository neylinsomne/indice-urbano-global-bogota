apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL
    type: postgres
    url: postgres:5432
    database: postgres
    user: postgres
    secureJsonData:
      password: ${PG_PASSWORD}
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      postgresVersion: 1600
    editable: false
